name: CI

on:
  pull_request:
    branches: [main]

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm install --prefix client

      - name: Type check
        run: npx tsc --noEmit

      - name: Build client
        run: npm run build

      - name: Run migrations
        run: npx drizzle-kit migrate
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test_db

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npx prettier --check . --ignore-path .gitignore || true
