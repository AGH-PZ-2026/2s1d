# docker compose up --build   → starts MySQL + (optional) MinIO + the app
#
# Services:
#   - db:     MySQL 8.4 (already used by Cloudflare wrangler dev)
#   - minio:  S3-compatible object storage (only started if you opt in via
#             PHOTOS_BACKEND=s3 — drop the `profiles:` block to disable)
#   - app:    The Hono API + built React SPA, served by Node.js
#
# Notes:
#   - The same `db` service works for both `wrangler dev` and the Node
#     server. They never run at the same time.
#   - In production you can drop `db` and point `DATABASE_URL` at an
#     external MySQL. Likewise drop `minio` and point the S3 env vars at
#     AWS S3 or a real R2 endpoint.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pz_db}
      MYSQL_USER: ${MYSQL_USER:-pz_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pz_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./2025-03-06_koidc.sql:/docker-entrypoint-initdb.d/2025-03-06_koidc.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      interval: 10s

  # Uncomment the next two services and set PHOTOS_BACKEND=s3 in `.env`
  # to store photos in a local S3-compatible bucket. Remove these for
  # the simpler "local filesystem" storage (default).
  # minio:
  #   image: minio/minio:latest
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  #   ports:
  #     - "9000:9000"  # S3 API
  #     - "9001:9001"  # Web console
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # minio-init:
  #   image: minio/mc:latest
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   entrypoint: >
  #     /bin/sh -c "
  #     mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
  #     mc mb --ignore-existing local/${S3_BUCKET:-pz-photos} &&
  #     mc anonymous set download local/${S3_BUCKET:-pz-photos} || true
  #     "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ─── Database ──────────────────────────────────────────────────────
      DATABASE_URL: mysql://${MYSQL_USER:-pz_user}:${MYSQL_PASSWORD:-pz_pass}@db:3306/${MYSQL_DATABASE:-pz_db}
      # ─── Auth ──────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      DEV_BYPASS_AUTH: ${DEV_BYPASS_AUTH:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # ─── Storage backend (default: local filesystem in /app/storage) ──
      PHOTOS_BACKEND: ${PHOTOS_BACKEND:-local}
      PHOTOS_LOCAL_DIR: /app/storage
      # For S3 / R2:
      # PHOTOS_BACKEND: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # ─── Server ────────────────────────────────────────────────────────
      PORT: 8787
      HOST: 0.0.0.0
      STATIC_DIR: /app/dist/client
    ports:
      - "${APP_PORT:-8787}:8787"
    volumes:
      - photos_data:/app/storage

volumes:
  mysql_data:
  photos_data:
  # minio_data:
